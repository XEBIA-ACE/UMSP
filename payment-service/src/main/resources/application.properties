# ============================================================
# Payment Service – Application Properties
# ============================================================
# All values can be overridden via environment variables.
# See .env.example for the full list of supported variables.
# ============================================================

# Server
server.port=${SERVER_PORT:8080}

# Stripe Gateway
stripe.api.key=${STRIPE_API_KEY:sk_test_placeholder}

# PayPal Gateway
paypal.client.id=${PAYPAL_CLIENT_ID:paypal_client_id_placeholder}
paypal.client.secret=${PAYPAL_CLIENT_SECRET:paypal_secret_placeholder}
paypal.mode=${PAYPAL_MODE:sandbox}

# OAuth2 Resource Server (JWT)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI:http://localhost:9000}

# Notification
notification.email.enabled=${NOTIFICATION_EMAIL_ENABLED:false}
